set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:RGB"

# start window numbers at 1 to match keyboard order with tmux window order
set -g base-index 1
set-window-option -g pane-base-index 1

# Split whit | and _
bind-key | split-window -h -c "#{pane_current_path}" # let's open pane with current directory with -c option
bind-key _ split-window -v -c "#{pane_current_path}"

# Vim style splits (s = horizontal, v = vertical)
bind-key s split-window -v -c "#{pane_current_path}"
bind-key v split-window -h -c "#{pane_current_path}"

# Pane: Vim Style Movements (no wrap)
bind-key h if-shell "[ #{pane_at_left} -eq 0 ]" "select-pane -L"
bind-key j if-shell "[ #{pane_at_bottom} -eq 0 ]" "select-pane -D"
bind-key l if-shell "[ #{pane_at_right} -eq 0 ]" "select-pane -R"
bind-key k if-shell "[ #{pane_at_top} -eq 0 ]" "select-pane -U"

# Vim Style Pane Resize
bind-key -r H resize-pane -L 2
bind-key -r J resize-pane -D 2
bind-key -r K resize-pane -U 2
bind-key -r L resize-pane -R 2

# Hide panel with ! and join with @
bind-key ! break-pane -d -t :99 -n _hidden_pane
bind-key @ join-pane -s :_hidden_pane -p 30

set -g mouse on

bind-key -n BTab next-window
bind-key n new-window
bind-key e choose-tree -sZ

set-option -sg escape-time 10

# Copy mode with vi keybindings
setw -g mode-keys vi
bind-key y copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Auto-select first pane when switching windows
set-hook -g after-select-window 'select-pane -t :.1'

set-option -sa terminal-features ',xterm-256color:RGB'

set -g status on
set -g status-position top
set -g status-bg colour240
set -g status-left-length 64

# Color hostname oragen when ctrl + b
# hostname [session_name] 1:window_1 (2:window_2)
set -g status-left "#{?client_prefix,#[bg=colour214],#[bg=colour240]} #H #[bg=colour240][#S] "
set -g status-right ""

# Window status styling
set -g window-status-format " #I:#W "
set -g window-status-current-format " (#I:#W) "
set -g window-status-style "bg=colour240,fg=white"
set -g window-status-current-style "bg=black,fg=white,bold"

set-option -g renumber-windows on

set -g allow-passthrough on
set -s set-clipboard on

